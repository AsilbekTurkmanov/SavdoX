version: '3.8'

services:
  # PostgreSQL Database Container
  postgres:
    image: postgres:16-alpine
    container_name: savdox_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: savdox_secure_password_123
      POSTGRES_DB: savdox_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d savdox_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # SavdoX Node.js + Express + React App Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: savdox_app
    restart: always
    ports:
      - "80:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:savdox_secure_password_123@postgres:5432/savdox_db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
